[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sack-train-ml"
version = "0.1.0"
description = "BSCP sack detector training pipeline — YOLO 11s → ONNX → Hailo HEF"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    # Pinned exactly, not floated. A run launched on 2026-09-02 picked up 8.4.137 —
    # a release five hours old whose auto-selected Muon optimizer crashed at epoch 1,
    # fixed the next day in 8.4.138. When a run is launched must not change what it does.
    # Bumping is deliberate: change this, then run the schema conformance test.
    "ultralytics==8.4.138",
    "onnx>=1.16.0",
    "onnxsim>=0.4.36",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Hailo SDK is vendor-distributed; install separately. These extras only
# describe Python packages that are available on PyPI.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter
